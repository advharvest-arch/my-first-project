<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaRoute — карта и измерения по воде</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script type="module" crossorigin src="./assets/index-BAfTSCzV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B4ymEGaf.css">
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="Карта мира"></div>

      <aside class="panel" id="panel">
        <header class="brand">
          <p class="brand-mark">AquaRoute</p>
        </header>

        <div class="mode-switch" role="tablist" aria-label="Режим">
          <button type="button" class="mode-btn active" data-mode="water">По воде</button>
          <button type="button" class="mode-btn" data-mode="ruler">Линейка</button>
        </div>

        <label class="field">
          <span>Подложка карты</span>
          <select id="basemap-select">
            <option value="osm" selected>OSM — реки, озёра, города</option>
            <option value="topo">Топокарта</option>
            <option value="satellite">Спутник</option>
            <option value="offline">Офлайн-контур</option>
          </select>
        </label>

        <div class="controls" id="shared-controls">
          <label class="field inline">
            <span>Скорость судна, км/ч</span>
            <input id="speed" type="number" min="1" max="120" step="1" value="20" />
          </label>
        </div>

        <div class="controls" id="sea-controls">
          <label class="field">
            <span>Сеть маршрута</span>
            <select id="route-prefer">
              <option value="river" selected>Реки и каналы</option>
              <option value="shortest">Кратчайший (река / море)</option>
              <option value="sea">Море</option>
            </select>
          </label>
        </div>

        <div class="waypoints-block" id="waypoints-block">
          <p class="muted" id="waypoint-count">Точек: 0</p>
          <div class="waypoint-list" id="waypoint-list" hidden></div>
        </div>

        <div class="controls route-style" id="route-style">
          <label class="field inline">
            <span>Цвет линии</span>
            <input id="line-color" type="color" value="#2ec4b6" />
          </label>
          <label class="field inline">
            <span>Толщина</span>
            <input id="line-weight" type="range" min="2" max="12" step="1" value="5" />
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-km-labels" />
            <span>Километраж у точек</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-return" checked />
            <span>Развести участки параллельно</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-arrows" checked />
            <span>Стрелки направления</span>
          </label>
        </div>

        <div class="actions">
          <button type="button" class="btn primary" id="route-btn" disabled>Проложить</button>
          <button type="button" class="btn ghost" id="undo-btn" hidden>Отменить точку</button>
          <button type="button" class="btn ghost" id="clear-btn">Сбросить</button>
        </div>

        <section class="stats" id="stats" hidden>
          <div class="stat">
            <span class="stat-label">Дистанция</span>
            <strong id="stat-distance">—</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Время в пути</span>
            <strong id="stat-eta">—</strong>
          </div>
        </section>

        <section class="route-desc" id="route-desc" hidden>
          <header class="route-desc-head">
            <h2 class="route-desc-title">Описание маршрута</h2>
            <button type="button" class="btn ghost route-desc-copy" id="route-desc-copy">
              Копировать
            </button>
          </header>
          <textarea
            id="route-desc-body"
            class="route-desc-body"
            readonly
            rows="4"
            spellcheck="false"
            aria-label="Описание маршрута"
          ></textarea>
        </section>

        <p class="status" id="status" role="status"></p>
        <button type="button" class="btn ghost collapse-btn" id="collapse-btn">Свернуть панель</button>
      </aside>

      <button type="button" class="panel-toggle" id="panel-toggle" aria-label="Показать панель">
        ☰
      </button>
    </div>
  </body>
</html>

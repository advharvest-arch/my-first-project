    <div id="boot-fallback" role="alert">
      Не удалось загрузить AquaRoute в этом браузере. Обновите браузер или откройте страницу в
      Chrome, Firefox, Safari, Edge или Яндекс&nbsp;Браузере.

    <div id="app" data-booting="1">
      <div id="map" aria-label="Карта мира"></div>

      <aside class="panel" id="panel">
        <header class="brand">
          <p class="brand-mark">AquaRoute</p>
          <p class="brand-sub">
            Водные маршруты с именами рек и озёр — GPX и ссылка без подписки
          </p>
        </header>

        <div class="mode-switch" role="tablist" aria-label="Режим">
          <button type="button" class="mode-btn active" data-mode="water">По воде</button>
          <button type="button" class="mode-btn" data-mode="ruler">Линейка</button>
        </div>

        <label class="field">
          <span>Подложка карты</span>
          <select id="basemap-select">
            <option value="osm" selected>Карта</option>
            <option value="topo">Топокарта</option>
            <option value="satellite">Спутник</option>
            <option value="offline">Офлайн-контур</option>
          </select>
        </label>

        <div class="controls" id="shared-controls">
          <label class="field inline">
            <span>Скорость судна, км/ч</span>
            <input id="speed" type="number" min="1" max="120" step="1" value="20" inputmode="numeric" />
          </label>
          <div class="presets speed-presets" id="speed-presets" role="group" aria-label="Пресет скорости">
            <button type="button" class="chip" data-speed="5">Байдарка · 5</button>
            <button type="button" class="chip" data-speed="12">Моторка · 12</button>
            <button type="button" class="chip active" data-speed="20">Катер · 20</button>
            <button type="button" class="chip" data-speed="40">Быстро · 40</button>
          </div>
        </div>

        <div class="waypoints-block" id="waypoints-block">
          <p class="muted" id="waypoint-count">Точек: 0</p>
          <div class="waypoint-list" id="waypoint-list" hidden></div>
        </div>

        <div class="controls route-style" id="route-style">
          <label class="field inline">
            <span>Цвет линии</span>
            <input id="line-color" type="color" value="#2ec4b6" />
          </label>
          <label class="field inline">
            <span>Толщина</span>
            <input id="line-weight" type="range" min="2" max="12" step="1" value="5" />
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-km-labels" />
            <span>Километраж у точек</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-distance-marks" checked />
            <span>Метки км вдоль пути</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-segment-labels" checked />
            <span>Подписи участков на карте</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-elevation" checked />
            <span>Профиль высот</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-return" checked />
            <span>Развести участки параллельно</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="show-arrows" checked />
            <span>Стрелки направления</span>
          </label>
        </div>

        <div class="actions">
          <button type="button" class="btn primary" id="route-btn" disabled>Проложить</button>
          <button type="button" class="btn ghost" id="undo-btn" hidden>Отменить точку</button>
          <button type="button" class="btn ghost" id="reverse-btn" hidden>Развернуть</button>
          <button type="button" class="btn ghost" id="clear-btn">Сбросить</button>
        </div>

        <section class="stats" id="stats" hidden>
          <div class="stat">
            <span class="stat-label">Дистанция</span>
            <strong id="stat-distance">—</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Время в пути</span>
            <strong id="stat-eta">—</strong>
          </div>
        </section>

        <div class="route-actions" id="route-actions" hidden>
          <button type="button" class="btn ghost" id="share-route-btn" title="Ссылка на маршрут" disabled>
            Ссылка

          <button type="button" class="btn ghost" id="gpx-export-btn" title="Скачать GPX" disabled>

            </div>
          </header>
          <ol class="route-desc-list" id="route-desc-list" hidden></ol>
          <textarea
            id="route-desc-body"
            class="route-desc-body"
            readonly
            rows="3"
            spellcheck="false"
            aria-label="Описание маршрута"

        </section>

        <p class="status" id="status" role="status"></p>
        <button type="button" class="btn ghost collapse-btn" id="collapse-btn">Свернуть панель</button>

      <button type="button" class="panel-toggle" id="panel-toggle" aria-label="Показать панель">

      </button>

    <script>
      // Slow networks: wait longer before declaring the browser unsupported.
      // Clear the message if the map mounts later.
      (function () {
        var shown = false;
        function mapReady() {
          var map = document.getElementById('map');
          return !!(map && map.classList.contains('leaflet-container'));
        }
        function showFallback() {
          var fallback = document.getElementById('boot-fallback');
          var app = document.getElementById('app');
          if (!fallback || mapReady()) return;
          shown = true;
          fallback.setAttribute('data-show', '1');
          if (app) app.style.display = 'none';
        }
        function hideFallback() {
          var fallback = document.getElementById('boot-fallback');
          var app = document.getElementById('app');
          if (fallback) fallback.removeAttribute('data-show');
          if (app) {
            app.style.display = '';
            app.removeAttribute('data-booting');
          }
          shown = false;
        }
        var started = Date.now();
        var timer = window.setInterval(function () {
          if (mapReady()) {
            hideFallback();
            window.clearInterval(timer);
            return;
          }
          if (!shown && Date.now() - started > 20000) showFallback();
        }, 400);
        window.setTimeout(function () {
          if (!mapReady()) showFallback();
        }, 20000);
      })();
    </script>

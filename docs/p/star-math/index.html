<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21144f">
  <meta name="description" content="Звёздная математика — добрая обучающая игра на сложение, вычитание и умножение для детей 5–9 лет.">
  <title>Звёздная математика — игра для детей</title>
  <style>
    :root {
      --ink: #24164b;
      --muted: #6e6488;
      --purple: #6d4aff;
      --purple-dark: #4a2bc4;
      --yellow: #ffd84d;
      --green: #25b989;
      --red: #ee5f74;
      --card: #fffdf9;
      --shadow: 0 18px 50px rgba(38, 20, 88, .22);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 16%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 83% 12%, rgba(255,216,77,.8) 0 3px, transparent 4px),
        radial-gradient(circle at 74% 72%, rgba(255,255,255,.7) 0 2px, transparent 3px),
        linear-gradient(145deg, #21144f 0%, #5035a5 58%, #7754d9 100%);
      background-size: 120px 120px, 190px 190px, 150px 150px, auto;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 920px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      position: relative;
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 900;
      letter-spacing: .2px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--yellow);
      color: #583d00;
      box-shadow: 0 5px 0 #caa527;
      transform: rotate(-4deg);
    }

    .icon-button {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 14px;
      color: #fff;
      background: rgba(255,255,255,.12);
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    .icon-button:hover { background: rgba(255,255,255,.22); }
    .icon-button:active { transform: scale(.94); }

    main {
      flex: 1;
      display: grid;
      align-items: center;
      padding: 22px 0 8px;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: enter .38s ease both; }

    .welcome {
      text-align: center;
      color: #fff;
    }

    .hero-art {
      width: 150px;
      height: 150px;
      margin: 0 auto 8px;
      position: relative;
      animation: float 3.2s ease-in-out infinite;
    }

    .planet {
      position: absolute;
      inset: 17px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 68px;
      background: linear-gradient(145deg, #ffdf65, #ff9c55);
      box-shadow: inset -12px -13px 0 rgba(187,76,62,.18), 0 15px 35px rgba(24,9,61,.3);
    }

    .planet::after {
      content: "";
      position: absolute;
      width: 156px;
      height: 38px;
      border: 10px solid #ff8ec4;
      border-radius: 50%;
      transform: rotate(-13deg);
      z-index: -1;
    }

    .spark {
      position: absolute;
      color: var(--yellow);
      font-size: 25px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.2));
    }
    .spark.one { top: 4px; right: 5px; }
    .spark.two { left: 0; bottom: 17px; font-size: 18px; }

    h1 {
      margin: 4px 0 8px;
      font-size: clamp(2.1rem, 7vw, 4.1rem);
      line-height: .98;
      letter-spacing: -2px;
      text-wrap: balance;
    }

    .lead {
      max-width: 550px;
      margin: 0 auto 25px;
      color: #ded7ff;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      line-height: 1.5;
    }

    .level-label {
      margin-bottom: 11px;
      color: #fff;
      font-weight: 800;
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    .level {
      min-height: 142px;
      padding: 16px 12px 14px;
      border: 3px solid transparent;
      border-radius: 23px;
      color: var(--ink);
      background: var(--card);
      box-shadow: 0 8px 0 rgba(22,10,61,.25);
      cursor: pointer;
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }

    .level:hover, .level:focus-visible {
      transform: translateY(-5px);
      border-color: var(--yellow);
      box-shadow: 0 12px 0 rgba(22,10,61,.22);
      outline: none;
    }

    .level:active { transform: translateY(2px); box-shadow: 0 4px 0 rgba(22,10,61,.25); }
    .level-emoji { display: block; font-size: 38px; margin-bottom: 6px; }
    .level strong { display: block; font-size: 1.04rem; }
    .level small { display: block; margin-top: 5px; color: var(--muted); line-height: 1.25; }

    .privacy-note {
      margin-top: 23px;
      color: #beb3ed;
      font-size: .82rem;
    }

    .game-wrap { max-width: 690px; margin: auto; }

    .game-status {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .progress-track {
      height: 15px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.35);
      border-radius: 99px;
      background: rgba(20,8,59,.3);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #ffd84d, #ff9c55);
      transition: width .35s ease;
    }

    .score-pill {
      padding: 8px 13px;
      border-radius: 99px;
      color: #4b3600;
      background: var(--yellow);
      box-shadow: 0 4px 0 #c5a026;
      font-weight: 900;
      white-space: nowrap;
    }

    .question-card {
      position: relative;
      padding: clamp(24px, 5vw, 42px);
      border-radius: 32px;
      text-align: center;
      background: var(--card);
      box-shadow: var(--shadow), 0 9px 0 rgba(31,13,78,.32);
      overflow: hidden;
    }

    .question-number {
      color: var(--purple);
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .visual-hint {
      min-height: 42px;
      margin-top: 13px;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      letter-spacing: 3px;
      overflow-wrap: anywhere;
    }

    .equation {
      margin: 6px 0 25px;
      font-size: clamp(3rem, 11vw, 5.6rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -3px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .answer {
      min-height: 78px;
      border: 3px solid #ddd6ee;
      border-radius: 20px;
      color: var(--ink);
      background: #fff;
      font-size: clamp(1.65rem, 5vw, 2.25rem);
      font-weight: 900;
      box-shadow: 0 6px 0 #d5cde7;
      cursor: pointer;
      transition: transform .14s, border-color .14s, background .14s;
    }

    .answer:hover:not(:disabled), .answer:focus-visible:not(:disabled) {
      border-color: var(--purple);
      transform: translateY(-3px);
      outline: none;
    }

    .answer:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #d5cde7; }
    .answer:disabled { cursor: default; }
    .answer.correct { color: #0a684d; border-color: var(--green); background: #dcfff4; box-shadow: 0 6px 0 #8addc3; animation: pop .35s ease; }
    .answer.wrong { color: #a11d37; border-color: var(--red); background: #fff0f2; box-shadow: 0 6px 0 #f2b3bd; animation: shake .32s ease; }

    .feedback {
      min-height: 68px;
      margin-top: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .feedback.good { color: #0c7a59; }
    .feedback.try { color: #bc3a50; }
    .feedback-icon { font-size: 35px; }

    .next-button, .again-button {
      min-height: 56px;
      padding: 0 28px;
      border: 0;
      border-radius: 17px;
      color: #fff;
      background: var(--purple);
      box-shadow: 0 6px 0 var(--purple-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .next-button:active, .again-button:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--purple-dark); }

    .finish-card {
      max-width: 610px;
      margin: auto;
      padding: clamp(28px, 6vw, 52px);
      border-radius: 34px;
      text-align: center;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .trophy { font-size: 82px; animation: pop .55s .1s ease both; }
    .finish-card h2 { margin: 10px 0 8px; font-size: clamp(2rem, 7vw, 3rem); }
    .finish-card p { color: var(--muted); font-size: 1.1rem; line-height: 1.5; }

    .result {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 23px 0 26px;
    }

    .result-score {
      font-size: clamp(3.2rem, 12vw, 5rem);
      line-height: 1;
      font-weight: 900;
      color: var(--purple);
    }

    .result-stars { max-width: 180px; font-size: 31px; letter-spacing: 2px; }

    .finish-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

    .home-button {
      min-height: 56px;
      padding: 0 23px;
      border: 3px solid #ddd6ee;
      border-radius: 17px;
      color: var(--ink);
      background: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .best {
      margin-top: 22px;
      color: #8d82a5;
      font-size: .9rem;
    }

    .confetti {
      position: fixed;
      top: -30px;
      width: 12px;
      height: 19px;
      border-radius: 4px;
      z-index: 10;
      pointer-events: none;
      animation: fall 2.1s ease-in forwards;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
    @keyframes float { 50% { transform: translateY(-9px) rotate(2deg); } }
    @keyframes pop { 50% { transform: scale(1.09); } }
    @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
    @keyframes fall { to { transform: translate3d(var(--drift), 110vh, 0) rotate(620deg); opacity: .9; } }

    @media (max-width: 620px) {
      .app { padding-left: 13px; padding-right: 13px; }
      main { align-items: start; padding-top: 14px; }
      .hero-art { width: 118px; height: 118px; }
      .planet { inset: 14px; font-size: 52px; }
      .planet::after { width: 123px; height: 30px; border-width: 8px; }
      .levels { grid-template-columns: 1fr; max-width: 410px; gap: 9px; }
      .level { min-height: 78px; padding: 11px 14px; display: grid; grid-template-columns: 54px 1fr; text-align: left; align-items: center; }
      .level-emoji { grid-row: 1 / 3; margin: 0; }
      .level small { margin-top: 2px; }
      .privacy-note { margin-top: 17px; }
      .question-card { border-radius: 25px; padding: 22px 16px; }
      .answer { min-height: 68px; }
      .feedback { margin-top: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">★</span><span>Звёздная математика</span></div>
      <button class="icon-button" id="soundButton" type="button" aria-label="Выключить звук" title="Звук">🔊</button>
    </header>

    <main>
      <section class="screen welcome active" id="welcomeScreen" aria-labelledby="gameTitle">
        <div class="hero-art" aria-hidden="true">
          <span class="spark one">✦</span><span class="spark two">★</span>
          <div class="planet">🚀</div>
        </div>
        <h1 id="gameTitle">Математика — это космос!</h1>
        <p class="lead">Реши 10 весёлых задач, собери звёзды и долети до новой планеты.</p>
        <div class="level-label">Выбери свою миссию</div>
        <div class="levels">
          <button class="level" type="button" data-level="start">
            <span class="level-emoji" aria-hidden="true">🌱</span>
            <strong>Первый полёт</strong>
            <small>Сложение до 10 · 5–6 лет</small>
          </button>
          <button class="level" type="button" data-level="explorer">
            <span class="level-emoji" aria-hidden="true">🪐</span>
            <strong>Исследователь</strong>
            <small>Плюс и минус до 20 · 6–8 лет</small>
          </button>
          <button class="level" type="button" data-level="captain">
            <span class="level-emoji" aria-hidden="true">🚀</span>
            <strong>Капитан</strong>
            <small>Умножение до 10 · 7–9 лет</small>
          </button>
        </div>
        <div class="privacy-note">Без рекламы и регистрации · Результаты остаются на устройстве</div>
      </section>

      <section class="screen game-wrap" id="gameScreen" aria-labelledby="questionLabel">
        <div class="game-status">
          <div class="progress-track" role="progressbar" aria-label="Прогресс миссии" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="score-pill" aria-label="Собрано звёзд">⭐ <span id="score">0</span></div>
        </div>
        <div class="question-card">
          <div class="question-number" id="questionLabel">Задание 1 из 10</div>
          <div class="visual-hint" id="visualHint" aria-hidden="true"></div>
          <div class="equation" id="equation"></div>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback" aria-live="polite">
            <span>Выбери правильный ответ</span>
          </div>
        </div>
      </section>

      <section class="screen" id="finishScreen" aria-labelledby="finishTitle">
        <div class="finish-card">
          <div class="trophy" id="finishEmoji" aria-hidden="true">🏆</div>
          <h2 id="finishTitle">Миссия выполнена!</h2>
          <p id="finishMessage">Ты отлично справился!</p>
          <div class="result">
            <div class="result-score"><span id="finalScore">0</span><small>/10</small></div>
            <div class="result-stars" id="resultStars" aria-label="Результат в звёздах"></div>
          </div>
          <div class="finish-actions">
            <button class="again-button" id="againButton" type="button">Играть ещё</button>
            <button class="home-button" id="homeButton" type="button">Другой уровень</button>
          </div>
          <div class="best" id="bestScore"></div>
        </div>
      </section>
    </main>
    <div class="sr-only" id="announcer" aria-live="assertive"></div>
  </div>

  <script>
    (() => {
      "use strict";

      const TOTAL = 10;
      const screens = {
        welcome: document.getElementById("welcomeScreen"),
        game: document.getElementById("gameScreen"),
        finish: document.getElementById("finishScreen")
      };
      const el = {
        sound: document.getElementById("soundButton"),
        progress: document.getElementById("progressFill"),
        progressTrack: document.querySelector(".progress-track"),
        score: document.getElementById("score"),
        label: document.getElementById("questionLabel"),
        hint: document.getElementById("visualHint"),
        equation: document.getElementById("equation"),
        answers: document.getElementById("answers"),
        feedback: document.getElementById("feedback"),
        finalScore: document.getElementById("finalScore"),
        resultStars: document.getElementById("resultStars"),
        finishEmoji: document.getElementById("finishEmoji"),
        finishMessage: document.getElementById("finishMessage"),
        bestScore: document.getElementById("bestScore"),
        announcer: document.getElementById("announcer")
      };

      let state = {
        level: "start",
        index: 0,
        score: 0,
        answered: false,
        current: null,
        sound: true
      };
      let audioContext;

      function showScreen(name) {
        Object.values(screens).forEach(screen => screen.classList.remove("active"));
        screens[name].classList.add("active");
      }

      function random(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function shuffle(items) {
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
      }

      function createQuestion() {
        let a, b, answer, sign;
        if (state.level === "start") {
          a = random(1, 8);
          b = random(1, 10 - a);
          answer = a + b;
          sign = "+";
        } else if (state.level === "explorer") {
          sign = Math.random() < .5 ? "+" : "−";
          if (sign === "+") {
            a = random(3, 15);
            b = random(2, 20 - a);
            answer = a + b;
          } else {
            a = random(7, 20);
            b = random(1, a - 1);
            answer = a - b;
          }
        } else {
          a = random(2, 10);
          b = random(2, 10);
          answer = a * b;
          sign = "×";
        }

        const options = new Set([answer]);
        const spread = state.level === "captain" ? 10 : 4;
        while (options.size < 4) {
          let candidate = answer + random(-spread, spread);
          if (candidate >= 0 && candidate !== answer) options.add(candidate);
        }
        return { a, b, sign, answer, options: shuffle([...options]) };
      }

      function getHint(question) {
        if (state.level !== "start") return state.level === "captain" ? "✨ Найди произведение ✨" : "🔭 Считай внимательно";
        const first = "⭐".repeat(question.a);
        const second = "⭐".repeat(question.b);
        return `${first}  +  ${second}`;
      }

      function renderQuestion() {
        state.answered = false;
        state.current = createQuestion();
        const number = state.index + 1;
        el.label.textContent = `Задание ${number} из ${TOTAL}`;
        el.progress.style.width = `${number / TOTAL * 100}%`;
        el.progressTrack.setAttribute("aria-valuenow", String(number));
        el.score.textContent = state.score;
        el.hint.textContent = getHint(state.current);
        el.equation.textContent = `${state.current.a} ${state.current.sign} ${state.current.b} = ?`;
        el.feedback.className = "feedback";
        el.feedback.innerHTML = "<span>Выбери правильный ответ</span>";
        el.answers.replaceChildren();

        state.current.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.textContent = option;
          button.dataset.value = option;
          button.setAttribute("aria-label", `Вариант ${index + 1}: ${option}`);
          button.addEventListener("click", () => chooseAnswer(button, option));
          el.answers.appendChild(button);
        });
        requestAnimationFrame(() => el.answers.querySelector("button")?.focus());
      }

      function chooseAnswer(button, value) {
        if (state.answered) return;
        state.answered = true;
        const correct = value === state.current.answer;
        const buttons = [...el.answers.querySelectorAll(".answer")];
        buttons.forEach(item => {
          item.disabled = true;
          if (Number(item.dataset.value) === state.current.answer) item.classList.add("correct");
        });

        if (correct) {
          state.score++;
          el.score.textContent = state.score;
          el.feedback.className = "feedback good";
          el.feedback.innerHTML = '<span class="feedback-icon">🌟</span><span>Верно! Звезда твоя!</span>';
          el.announcer.textContent = "Правильно!";
          playSound("correct");
        } else {
          button.classList.add("wrong");
          el.feedback.className = "feedback try";
          el.feedback.innerHTML = `<span class="feedback-icon">💫</span><span>Почти! Правильный ответ — ${state.current.answer}</span>`;
          el.announcer.textContent = `Правильный ответ: ${state.current.answer}`;
          playSound("wrong");
        }

        const next = document.createElement("button");
        next.type = "button";
        next.className = "next-button";
        next.textContent = state.index === TOTAL - 1 ? "Увидеть результат" : "Дальше →";
        next.addEventListener("click", nextQuestion);
        el.feedback.appendChild(next);
        setTimeout(() => next.focus(), 280);
      }

      function nextQuestion() {
        state.index++;
        if (state.index >= TOTAL) {
          finishGame();
        } else {
          renderQuestion();
        }
      }

      function startGame(level) {
        state.level = level;
        state.index = 0;
        state.score = 0;
        showScreen("game");
        renderQuestion();
        playSound("start");
      }

      function finishGame() {
        const score = state.score;
        const starCount = score >= 9 ? 3 : score >= 6 ? 2 : 1;
        const messages = score >= 9
          ? ["Вот это полёт! Ты настоящий капитан!", "🏆"]
          : score >= 6
            ? ["Отличная работа! Ещё немного — и новый рекорд!", "🌟"]
            : ["Хорошее начало! Каждая тренировка делает нас сильнее.", "🚀"];

        el.finalScore.textContent = score;
        el.resultStars.textContent = "⭐".repeat(starCount) + "☆".repeat(3 - starCount);
        el.finishMessage.textContent = messages[0];
        el.finishEmoji.textContent = messages[1];

        const key = `starMathBest-${state.level}`;
        let best = score;
        try {
          best = Math.max(score, Number(localStorage.getItem(key) || 0));
          localStorage.setItem(key, String(best));
        } catch (_) {}
        el.bestScore.textContent = `Твой лучший результат на этом уровне: ${best} из ${TOTAL}`;
        showScreen("finish");
        if (score >= 6) makeConfetti();
        playSound("finish");
        document.getElementById("againButton").focus();
      }

      function makeConfetti() {
        const colors = ["#ffd84d", "#ff74aa", "#62dfb5", "#8e73ff", "#ff9c55"];
        for (let i = 0; i < 42; i++) {
          const piece = document.createElement("i");
          piece.className = "confetti";
          piece.style.left = `${random(2, 98)}vw`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--drift", `${random(-100, 100)}px`);
          piece.style.animationDelay = `${Math.random() * .8}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 3000);
        }
      }

      function playSound(type) {
        if (!state.sound) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const notes = type === "correct" ? [523, 659, 784]
            : type === "wrong" ? [260, 220]
            : type === "finish" ? [523, 659, 784, 1046]
            : [392, 523];
          notes.forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(.0001, audioContext.currentTime + index * .1);
            gain.gain.exponentialRampToValueAtTime(.12, audioContext.currentTime + index * .1 + .015);
            gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + index * .1 + .16);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(audioContext.currentTime + index * .1);
            oscillator.stop(audioContext.currentTime + index * .1 + .18);
          });
        } catch (_) {}
      }

      document.querySelectorAll(".level").forEach(button => {
        button.addEventListener("click", () => startGame(button.dataset.level));
      });

      document.getElementById("againButton").addEventListener("click", () => startGame(state.level));
      document.getElementById("homeButton").addEventListener("click", () => {
        showScreen("welcome");
        document.querySelector(".level").focus();
      });

      el.sound.addEventListener("click", () => {
        state.sound = !state.sound;
        el.sound.textContent = state.sound ? "🔊" : "🔇";
        el.sound.setAttribute("aria-label", state.sound ? "Выключить звук" : "Включить звук");
        if (state.sound) playSound("start");
      });

      document.addEventListener("keydown", event => {
        if (!screens.game.classList.contains("active") || state.answered) return;
        const index = Number(event.key) - 1;
        const button = el.answers.querySelectorAll(".answer")[index];
        if (button) button.click();
      });
    })();
  </script>
</body>
</html>

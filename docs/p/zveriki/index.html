<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зверики — найди пару | игра для детей</title>
  <meta name="description" content="Зверики — весёлая игра на память для детей. Найди пары животных прямо в браузере.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;550;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #7ec8f0;
      --sky-mid: #b8e4c9;
      --sky-bottom: #ffe8a3;
      --leaf: #2f9e6b;
      --leaf-deep: #1f7a52;
      --sun: #ffd54a;
      --coral: #ff7a59;
      --ink: #1f3d33;
      --cream: #fffaf0;
      --card-back: #3db88a;
      --shadow: rgba(31, 61, 51, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.45) 0 18%, transparent 19%),
        radial-gradient(circle at 85% 12%, rgba(255, 255, 255, 0.35) 0 12%, transparent 13%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
      overflow-x: hidden;
    }

    .sky-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      filter: blur(0.5px);
      animation: drift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud.c1 { width: 120px; height: 40px; top: 8%; left: -140px; animation-duration: 42s; }
    .cloud.c1::before { width: 50px; height: 50px; top: -28px; left: 18px; }
    .cloud.c1::after { width: 70px; height: 70px; top: -38px; left: 48px; }

    .cloud.c2 { width: 160px; height: 48px; top: 18%; left: -180px; animation-duration: 55s; animation-delay: -18s; }
    .cloud.c2::before { width: 60px; height: 60px; top: -32px; left: 24px; }
    .cloud.c2::after { width: 80px; height: 80px; top: -42px; left: 60px; }

    .cloud.c3 { width: 100px; height: 34px; top: 28%; left: -120px; animation-duration: 48s; animation-delay: -30s; }
    .cloud.c3::before { width: 42px; height: 42px; top: -22px; left: 14px; }
    .cloud.c3::after { width: 56px; height: 56px; top: -30px; left: 40px; }

    .hill {
      position: absolute;
      bottom: -40px;
      width: 140%;
      height: 180px;
      left: -20%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #6fd39a 0%, #3aa66f 100%);
      opacity: 0.55;
    }

    .hill.h2 {
      height: 140px;
      bottom: -50px;
      background: linear-gradient(180deg, #4fbf82 0%, #2f9e6b 100%);
      opacity: 0.7;
      transform: translateX(8%);
    }

    .sun {
      position: absolute;
      top: 6%;
      right: 8%;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff6c8, var(--sun) 55%, #ffb84d 100%);
      box-shadow: 0 0 0 12px rgba(255, 213, 74, 0.22);
      animation: pulse-sun 4s ease-in-out infinite;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 220px)); }
    }

    @keyframes pulse-sun {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .back {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 5;
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      background: rgba(255, 250, 240, 0.72);
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: clamp(2.6rem, 10vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--leaf-deep);
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.45);
      margin-top: 2.2rem;
      animation: pop-in 0.7s cubic-bezier(0.22, 1.4, 0.36, 1) both;
    }

    .brand span {
      color: var(--coral);
    }

    .tagline {
      margin-top: 0.45rem;
      font-size: 1.05rem;
      font-weight: 800;
      color: rgba(31, 61, 51, 0.78);
      text-align: center;
      animation: fade-up 0.7s 0.15s both;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.7) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      margin-top: 1.4rem;
      animation: fade-up 0.45s ease both;
    }

    .screen.active { display: flex; }

    .levels {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      margin-top: 0.5rem;
    }

    .level-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "Fredoka", sans-serif;
      font-weight: 550;
      font-size: 1.15rem;
      color: var(--cream);
      background: linear-gradient(180deg, #49c489, var(--leaf));
      padding: 1rem 1.35rem;
      border-radius: 1.25rem;
      min-width: 150px;
      box-shadow: 0 6px 0 var(--leaf-deep), 0 12px 24px var(--shadow);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .level-btn:hover { transform: translateY(-2px); }
    .level-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--leaf-deep), 0 6px 14px var(--shadow);
    }

    .level-btn small {
      display: block;
      font-family: "Nunito", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      opacity: 0.9;
      margin-top: 0.2rem;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .stat {
      font-family: "Fredoka", sans-serif;
      font-size: 1.05rem;
      font-weight: 550;
      background: rgba(255, 250, 240, 0.78);
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      box-shadow: 0 4px 14px var(--shadow);
    }

    .stat strong { color: var(--coral); }

    .ghost-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "Nunito", sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--leaf-deep);
      background: rgba(255, 250, 240, 0.78);
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      box-shadow: 0 4px 14px var(--shadow);
    }

    .board {
      width: 100%;
      display: grid;
      gap: 0.7rem;
      perspective: 1000px;
    }

    .board.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .board.cols-4 { grid-template-columns: repeat(4, 1fr); }

    .card {
      aspect-ratio: 1;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      perspective: 800px;
      -webkit-tap-highlight-color: transparent;
    }

    .card:disabled { cursor: default; }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 1rem;
      box-shadow: 0 8px 0 rgba(31, 61, 51, 0.12);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card.matched .card-inner {
      animation: match-bounce 0.55s ease;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 1rem;
      backface-visibility: hidden;
      display: grid;
      place-items: center;
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      user-select: none;
    }

    .face.back {
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.35), transparent 40%),
        linear-gradient(160deg, #57d29a, var(--card-back) 55%, #2f9e6b);
      color: rgba(255, 255, 255, 0.95);
      font-family: "Fredoka", sans-serif;
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 700;
    }

    .face.front {
      background: linear-gradient(180deg, #fffef8, #ffe9b8);
      transform: rotateY(180deg);
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    .card.wrong .face.front {
      animation: shake 0.4s ease;
      background: linear-gradient(180deg, #fff5f2, #ffd0c4);
    }

    @keyframes match-bounce {
      0% { transform: rotateY(180deg) scale(1); }
      40% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }

    .win-panel {
      text-align: center;
      background: rgba(255, 250, 240, 0.88);
      border-radius: 1.5rem;
      padding: 1.6rem 1.4rem;
      box-shadow: 0 16px 40px var(--shadow);
      max-width: 420px;
      width: 100%;
    }

    .win-panel h2 {
      font-family: "Fredoka", sans-serif;
      font-size: clamp(2rem, 8vw, 2.8rem);
      color: var(--leaf-deep);
      margin-bottom: 0.4rem;
    }

    .win-panel p {
      font-weight: 800;
      margin-bottom: 1.2rem;
      color: rgba(31, 61, 51, 0.8);
    }

    .win-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: center;
    }

    .primary-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "Fredoka", sans-serif;
      font-weight: 550;
      font-size: 1.1rem;
      color: var(--cream);
      background: linear-gradient(180deg, #ff9377, var(--coral));
      padding: 0.9rem 1.3rem;
      border-radius: 1.1rem;
      box-shadow: 0 5px 0 #d85a3d, 0 10px 22px var(--shadow);
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d85a3d, 0 6px 14px var(--shadow);
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .bit {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 14px;
      border-radius: 3px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.2;
      }
    }

    @media (max-width: 480px) {
      .board { gap: 0.5rem; }
      .level-btn { min-width: 132px; }
      .wrap { padding-top: 0.75rem; }
    }
  </style>
</head>
<body>
  <a href="../../" class="back">← Все игры</a>

  <div class="sky-deco" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hill"></div>
    <div class="hill h2"></div>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <main class="wrap">
    <h1 class="brand">Звер<span>ики</span></h1>
    <p class="tagline" id="tagline">Найди пару зверюшек!</p>

    <section class="screen active" id="menu" aria-label="Выбор уровня">
      <div class="levels">
        <button class="level-btn" data-pairs="4" data-cols="3">Лёгкий<small>4 пары</small></button>
        <button class="level-btn" data-pairs="6" data-cols="4">Средний<small>6 пар</small></button>
        <button class="level-btn" data-pairs="8" data-cols="4">Сложный<small>8 пар</small></button>
      </div>
    </section>

    <section class="screen" id="play" aria-label="Игровое поле">
      <div class="hud">
        <div class="stat">Ходы: <strong id="moves">0</strong></div>
        <div class="stat">Пары: <strong id="pairs">0</strong>/<span id="pairsTotal">0</span></div>
        <button class="ghost-btn" id="menuBtn" type="button">В меню</button>
      </div>
      <div class="board cols-4" id="board" role="grid" aria-label="Карточки животных"></div>
    </section>

    <section class="screen" id="win" aria-label="Победа">
      <div class="win-panel">
        <h2>Ура! 🎉</h2>
        <p id="winText">Все пары найдены!</p>
        <div class="win-actions">
          <button class="primary-btn" id="againBtn" type="button">Ещё раз</button>
          <button class="ghost-btn" id="winMenuBtn" type="button">Другой уровень</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const ANIMALS = ["🐶", "🐱", "🐰", "🦊", "🐻", "🐼", "🦁", "🐸", "🐷", "🐵", "🦉", "🦄"];
    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const pairsEl = document.getElementById("pairs");
    const pairsTotalEl = document.getElementById("pairsTotal");
    const winTextEl = document.getElementById("winText");
    const confettiEl = document.getElementById("confetti");
    const taglineEl = document.getElementById("tagline");

    let pairCount = 6;
    let cols = 4;
    let moves = 0;
    let matched = 0;
    let lock = false;
    let first = null;
    let second = null;
    let audioCtx = null;

    function show(id) {
      document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      if (id === "menu") taglineEl.textContent = "Найди пару зверюшек!";
      if (id === "play") taglineEl.textContent = "Открой две одинаковые!";
      if (id === "win") taglineEl.textContent = "Ты супер!";
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(freq, dur, type, gain) {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = gain || 0.08;
      o.connect(g);
      g.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.start(now);
      o.stop(now + dur);
    }

    function sfx(kind) {
      ensureAudio();
      if (!audioCtx) return;
      if (kind === "flip") tone(520, 0.08, "triangle", 0.05);
      if (kind === "match") {
        tone(660, 0.1, "sine", 0.07);
        setTimeout(() => tone(880, 0.14, "sine", 0.07), 90);
      }
      if (kind === "miss") tone(180, 0.16, "sawtooth", 0.03);
      if (kind === "win") {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, "sine", 0.08), i * 120));
      }
    }

    function burstConfetti() {
      confettiEl.innerHTML = "";
      const colors = ["#ff7a59", "#ffd54a", "#49c489", "#7ec8f0", "#ff9ec8", "#fffaf0"];
      for (let i = 0; i < 48; i++) {
        const bit = document.createElement("span");
        bit.className = "bit";
        bit.style.left = Math.random() * 100 + "%";
        bit.style.background = colors[i % colors.length];
        bit.style.animationDuration = 1.6 + Math.random() * 1.8 + "s";
        bit.style.animationDelay = Math.random() * 0.35 + "s";
        bit.style.transform = `rotate(${Math.random() * 360}deg)`;
        confettiEl.appendChild(bit);
      }
      setTimeout(() => { confettiEl.innerHTML = ""; }, 3600);
    }

    function startGame(pairs, columnCount) {
      pairCount = pairs;
      cols = columnCount;
      moves = 0;
      matched = 0;
      lock = false;
      first = null;
      second = null;
      movesEl.textContent = "0";
      pairsEl.textContent = "0";
      pairsTotalEl.textContent = String(pairCount);
      boardEl.className = "board cols-" + cols;

      const picks = shuffle(ANIMALS).slice(0, pairCount);
      const deck = shuffle(picks.concat(picks));
      boardEl.innerHTML = "";

      deck.forEach((emoji, index) => {
        const btn = document.createElement("button");
        btn.className = "card";
        btn.type = "button";
        btn.setAttribute("aria-label", "Закрытая карточка");
        btn.dataset.emoji = emoji;
        btn.dataset.index = String(index);
        btn.innerHTML =
          '<div class="card-inner">' +
            '<div class="face back">?</div>' +
            '<div class="face front">' + emoji + "</div>" +
          "</div>";
        btn.addEventListener("click", () => onFlip(btn));
        boardEl.appendChild(btn);
      });

      show("play");
    }

    function onFlip(card) {
      if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;
      ensureAudio();
      card.classList.add("flipped");
      card.setAttribute("aria-label", "Карточка: " + card.dataset.emoji);
      sfx("flip");

      if (!first) {
        first = card;
        return;
      }

      second = card;
      moves += 1;
      movesEl.textContent = String(moves);
      lock = true;

      if (first.dataset.emoji === second.dataset.emoji) {
        first.classList.add("matched");
        second.classList.add("matched");
        first.disabled = true;
        second.disabled = true;
        matched += 1;
        pairsEl.textContent = String(matched);
        sfx("match");
        first = null;
        second = null;
        lock = false;
        if (matched === pairCount) finish();
      } else {
        first.classList.add("wrong");
        second.classList.add("wrong");
        sfx("miss");
        const a = first;
        const b = second;
        setTimeout(() => {
          a.classList.remove("flipped", "wrong");
          b.classList.remove("flipped", "wrong");
          a.setAttribute("aria-label", "Закрытая карточка");
          b.setAttribute("aria-label", "Закрытая карточка");
          first = null;
          second = null;
          lock = false;
        }, 700);
      }
    }

    function finish() {
      const praise =
        moves <= pairCount + 2
          ? "Невероятно! Всего " + moves + " ходов!"
          : moves <= pairCount * 2
            ? "Отлично! Ты нашёл все пары за " + moves + " ходов."
            : "Молодец! Все пары найдены за " + moves + " ходов.";
      winTextEl.textContent = praise;
      sfx("win");
      burstConfetti();
      setTimeout(() => show("win"), 450);
    }

    document.querySelectorAll(".level-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        ensureAudio();
        startGame(Number(btn.dataset.pairs), Number(btn.dataset.cols));
      });
    });

    document.getElementById("menuBtn").addEventListener("click", () => show("menu"));
    document.getElementById("winMenuBtn").addEventListener("click", () => show("menu"));
    document.getElementById("againBtn").addEventListener("click", () => startGame(pairCount, cols));
  </script>
</body>
</html>

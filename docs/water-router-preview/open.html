              <div>Коридоры: <code>${r.visitedCorridors.length ? r.visitedCorridors.join(', ') : 'нет'}</code></div>
            </div>
          `;
          card.onclick = () => {
            selectedId = selectedId === r.routeId ? null : r.routeId;
            render();
          };
          routesEl.appendChild(card);
        });
      }
      render();
    </script>
  </body>
</html>
